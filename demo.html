<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUCTIX interactive demo</title>
<meta name="description" content="Click through AUCTIX with sample data: a nonprofit, a café, a concrete contractor and a CPA firm running their books, people and payments in one platform.">
<link rel="canonical" href="https://auctixtech.com/demo">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AUCTIX">
<meta property="og:title" content="Try AUCTIX: interactive demo">
<meta property="og:description" content="See what running your organization on AUCTIX looks like. No sign-up, sample data.">
<meta property="og:url" content="https://auctixtech.com/demo">
<meta property="og:image" content="https://auctixtech.com/assets/img/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: a shipped product, calm and confident: the back office a small organization runs on
   IDEA: the AUCTIX app itself, with a slim demo bar on top that switches business type and walks a guided tour
   PICTURE: every screen is the working tool, opened mid-use with believable sample data
   COLOUR and TYPE: Auctix navy #191B53, royal #0D459F, light blue #7FA3E0; Manrope, IBM Plex Mono for figures
   LAYOUT: demo bar, navy sidebar, sticky header, content to 1240px; drawer nav under 900px, stacked tables under 600px */
:root{color-scheme:light dark;
--bg:light-dark(#F4F5F9,#0D0F2B);--sf:light-dark(#FFFFFF,#161939);--sf2:light-dark(#F7F8FC,#1C2047);
--ink:light-dark(#161A2E,#E9ECF8);--mu:light-dark(#5A6072,#A6AECB);--ln:light-dark(#DCE0EA,#2B3062);--ln2:light-dark(#EDF0F6,#232750);
--nv:#191B53;--ry:light-dark(#0D459F,#8DB0EE);--ryf:#0D459F;--lb:#7FA3E0;
--okb:light-dark(#E5ECF9,#1F2D60);--ok:light-dark(#0D459F,#B4CBF3);
--gnb:light-dark(#E2F3E9,#123826);--gn:light-dark(#176640,#86D8AC);
--wnb:light-dark(#FDF0DC,#3A2B10);--wn:light-dark(#7A4A00,#F3C27A);
--bdb:light-dark(#FDE7E5,#401818);--bd:light-dark(#B42318,#F5A097);
--mub:light-dark(#EEF0F5,#252950)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ry)}
:focus-visible{outline:3px solid var(--lb);outline-offset:2px}
.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num,.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}

/* demo bar */
.demo{background:#0A0B26;color:#fff;display:flex;align-items:center;gap:14px;padding:8px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.01em;font-size:16px}
.mark{width:28px;height:28px;border-radius:7px;background:#fff;display:grid;place-items:center}
.brand small{font-weight:600;font-size:12px;color:#A9B4D6}
.eds{display:flex;gap:4px;background:#17194A;border-radius:10px;padding:3px;overflow-x:auto;scrollbar-width:none}
.eds button{flex:none;border:0;background:transparent;color:#C9D2EE;font-weight:700;font-size:13px;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;min-height:36px}
.eds button[aria-pressed=true]{background:#fff;color:var(--nv)}
.dright{margin-left:auto;display:flex;gap:8px}
.dbtn.p{background:#fff;color:#191B53;border-color:#fff;display:inline-flex;align-items:center;text-decoration:none}
.brand{color:#fff;text-decoration:none}
.soon{margin-left:auto;font-size:10px;font-weight:800;color:#3A2400;background:#F2B33D;border-radius:4px;padding:1px 5px}
.dbtn{border:1px solid #34387A;background:transparent;color:#fff;border-radius:8px;padding:0 12px;min-height:36px;font-weight:700;font-size:13px;cursor:pointer}

/* shell */
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{background:var(--nv);color:#D3DBF0;position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:14px;z-index:25}
.org{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;border:1px solid #343877;background:#23266A;color:#fff;text-align:left;cursor:pointer;min-height:52px}
.badge{width:32px;height:32px;flex:none;border-radius:8px;color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center}
.org b{display:block;font-size:13px;line-height:1.25}.org span span{font-size:12px;color:#A9B4D6}
.nav{display:flex;flex-direction:column;gap:1px}
.nav h3{margin:0;padding:12px 12px 4px;font-size:12px;font-weight:700;color:#8F9CC8}
.nav a{display:flex;align-items:center;gap:11px;min-height:38px;padding:0 12px;border-radius:8px;color:#D3DBF0;font-weight:600;font-size:14px;text-decoration:none}
.nav a:hover{background:#20236A}
.nav a[aria-current=page]{background:#2A3A8F;color:#fff;font-weight:700}
.nav a .i{color:#A9B4D6}.nav a[aria-current=page] .i{color:#9DBDF5}
.cnt{margin-left:auto;font-size:11px;font-weight:800;color:var(--nv);background:#9DBDF5;border-radius:999px;padding:1px 7px}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:#23266A}
.av{width:32px;height:32px;border-radius:50%;background:#3A4BA0;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.me b{display:block;font-size:13px;color:#fff}.me span span{font-size:12px;color:#A9B4D6}
.main{display:flex;flex-direction:column;min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 28px;background:var(--sf);border-bottom:1px solid var(--ln)}
.srch{flex:1 1 260px;max-width:480px;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf2);color:var(--mu)}
.card .srch,.content>.srch{flex:none}
.srch input{border:0;background:transparent;outline:none;flex:1;font-size:15px;color:var(--ink)}
.chip{font-size:12px;font-weight:700;color:var(--wn);background:var(--wnb);border-radius:999px;padding:4px 10px;white-space:nowrap}
.ib{width:42px;height:42px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink)}
.menu{display:none}
.askb{display:flex;align-items:center;gap:7px;height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);font-weight:700;font-size:14px;cursor:pointer;margin-left:auto;white-space:nowrap}
.askb .i{color:var(--ry)}
.content{padding:24px 28px 150px;max-width:1260px;width:100%;display:flex;flex-direction:column;gap:20px}

/* page parts */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px}
.ph>div:first-child{flex:1 1 300px}
.ph p{margin:0 0 3px;font-size:13px;font-weight:600;color:var(--mu)}
.ph h1{margin:0;font-size:clamp(24px,3vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:42px;padding:0 15px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--lb)}
.btn.p{background:var(--ryf);border-color:var(--ryf);color:#fff}
.btn.s{min-height:34px;padding:0 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kl{font-size:13px;font-weight:600;color:var(--mu)}
.kv{font-size:clamp(22px,2.4vw,28px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.ks{font-size:13px;color:var(--mu)}.ks.up{color:var(--ry);font-weight:600}
.bad{color:var(--bd);font-weight:700}.warn{color:var(--wn);font-weight:700}.good{color:var(--gn);font-weight:700}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ch{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.ch h2{margin:0;font-size:16px;font-weight:800}
.ch .x{margin-left:auto;font-size:13px;font-weight:700;color:var(--ry);text-decoration:none;cursor:pointer;background:none;border:0;padding:4px 0}
.sub{font-size:13px;color:var(--mu)}
.g2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
.g11{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.g12{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap;background:var(--mub);color:var(--mu)}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.gn{background:var(--gnb);color:var(--gn)}.pill.wn{background:var(--wnb);color:var(--wn)}.pill.bd{background:var(--bdb);color:var(--bd)}
.tw{overflow-x:auto}
.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;color:var(--mu);font-size:12px;font-weight:700;padding:8px;white-space:nowrap}
.t td{padding:10px 8px;border-top:1px solid var(--ln2);vertical-align:middle}
.t th:first-child,.t td:first-child{padding-left:0}.t th:last-child,.t td:last-child{padding-right:0}
.t .r{text-align:right}
.t tr.link{cursor:pointer}.t tr.link:hover td{background:var(--sf2)}
.t tfoot td{font-weight:800;border-top:2px solid var(--ln)}
.strong{font-weight:700}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 0;border-top:1px solid var(--ln2);color:var(--ink);text-decoration:none;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer;font-size:14px}
.li:first-child{border-top:0}
.li .f{flex:1;min-width:0}.li small{display:block;color:var(--mu);font-size:12px}
.cntb{font-size:12px;font-weight:800;border-radius:6px;padding:3px 7px;min-width:28px;text-align:center}
.mt{height:7px;border-radius:4px;background:var(--ln2);overflow:hidden}.mt i{display:block;height:100%;background:var(--ryf);border-radius:4px}
.mt.w i{background:#D08A1A}.mt.b i{background:#C0392B}.mt.g i{background:#2F8A5B}
.vb{display:flex;align-items:stretch;gap:6px;height:220px}
.vbc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.vbw{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border-bottom:1px solid var(--ln)}
.vbb{width:62%;max-width:38px;border-radius:4px 4px 0 0;background:var(--lb);opacity:.75}
.vbb.hl{background:var(--ryf);opacity:1}
.vbv{font-size:12px;font-weight:700;white-space:nowrap}.vbl{font-size:11px;color:var(--mu);white-space:nowrap}
.hb{display:flex;flex-direction:column;gap:10px}
.hbr{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hbt{height:10px;border-radius:5px;background:var(--ln2);position:relative}
.hbt i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ryf)}
.cb{width:22px;height:22px;border-radius:6px;border:2px solid var(--ln);background:var(--sf);display:grid;place-items:center;cursor:pointer;flex:none;padding:0;color:#fff}
.cb.on{background:var(--ryf);border-color:var(--ryf)}
.tog{width:44px;height:26px;border-radius:13px;border:0;background:var(--ln);position:relative;cursor:pointer;flex:none;padding:0}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--ryf)}.tog.on::after{left:21px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700}
.inp{height:42px;border:1px solid var(--ln);border-radius:9px;background:var(--sf);padding:0 11px;font-size:16px;font-weight:500;width:100%}
textarea.inp{height:auto;padding:10px 11px;resize:vertical;min-height:90px;line-height:1.45}
.inp.sm{height:36px;font-size:15px;padding:0 8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;font-size:14px;color:var(--mu);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ryf)}
.note{font-size:13px;color:var(--mu);background:var(--sf2);border:1px dashed var(--ln);border-radius:10px;padding:10px 12px}
.ai{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ry)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:0 13px;min-height:36px;font-weight:700;font-size:13px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--nv);color:#fff;border-color:var(--nv)}
.tl{display:flex;flex-direction:column}
.tli{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--ln2)}
.tli:first-child{border-top:0}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--okb);color:var(--ok)}
.tli b{font-size:14px}.tli small{display:block;color:var(--mu);font-size:12px}
.empty{padding:26px;text-align:center;color:var(--mu);font-size:14px}

/* overlays */
.ov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px}
.bdp{position:absolute;inset:0;background:rgba(8,10,35,.55)}
.mdl{position:relative;background:var(--sf);border-radius:16px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.mdl.wide{width:min(880px,100%)}
.mdl h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.mdl .acts{justify-content:flex-end}
.wel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.welc{border:1px solid var(--ln);border-radius:14px;padding:16px;background:var(--sf2);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.welc:hover{border-color:var(--ryf)}
.welc b{font-size:16px}.welc>span:last-child{font-size:13px;color:var(--mu)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--sf);z-index:55;box-shadow:-12px 0 40px rgba(0,0,0,.2);display:flex;flex-direction:column}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--ln)}
.drawer .db{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:12px;flex:1}
.bub{background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;font-size:14px}
.bub.me{background:var(--okb);border-color:transparent;align-self:flex-end;max-width:85%}
.qbtn{text-align:left;border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px;cursor:pointer}
.tour{position:fixed;right:16px;bottom:16px;z-index:50;width:min(360px,calc(100vw - 32px));background:var(--nv);color:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 18px 50px rgba(10,12,40,.4);display:flex;flex-direction:column;gap:8px}
.tour p{margin:0;font-size:14px;color:#D3DBF0;line-height:1.5}
.tour h4{margin:0;font-size:16px;font-weight:800}
.tour .tm{font-size:12px;font-weight:700;color:#9DBDF5;display:flex;align-items:center;gap:8px}
.tour .tm button{margin-left:auto;background:none;border:0;color:#A9B4D6;cursor:pointer;font-weight:700;font-size:13px;padding:6px}
.tour .row button{min-height:38px;border-radius:9px;padding:0 14px;font-weight:700;font-size:14px;cursor:pointer;border:1px solid #3B3F86;background:transparent;color:#fff}
.tour .row .nx{background:#fff;color:var(--nv);border-color:#fff;margin-left:auto}
.tdots{display:flex;gap:4px}.tdots i{width:6px;height:6px;border-radius:3px;background:#3B3F86}.tdots i.on{background:#9DBDF5;width:16px}
.tpill{position:fixed;right:16px;bottom:16px;z-index:50;background:var(--nv);color:#fff;border:0;border-radius:999px;padding:0 18px;min-height:46px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 10px 30px rgba(10,12,40,.35)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:70;background:#0A0B26;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.3);transition:.25s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* devices */
.stage{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;justify-content:center}
.phone{width:380px;height:780px;border-radius:44px;border:12px solid #0A0B26;background:#0A0B26;position:relative;flex:none;box-shadow:0 30px 60px rgba(10,12,40,.25)}
.pscr{--pc:#0D459F;--pcl:#E5ECF9;position:absolute;inset:0;border-radius:32px;overflow:hidden;display:flex;flex-direction:column;color-scheme:light;background:var(--bg);color:var(--ink)}
.pbody{flex:1;overflow-y:auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px}
.pbar{padding:34px 16px 12px;background:var(--nv);color:#fff;display:flex;align-items:center;gap:10px}
.pbar b{font-size:17px}
.ptabs{display:flex;border-top:1px solid var(--ln);background:var(--sf)}
.ptabs button{flex:1;border:0;background:none;padding:8px 0 14px;font-size:11px;font-weight:700;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.ptabs button[aria-selected=true]{color:var(--ryf)}
.pcard{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.side-note{flex:1 1 280px;max-width:420px;display:flex;flex-direction:column;gap:12px}
.browser{border-radius:14px;border:1px solid var(--ln);overflow:hidden;background:#fff;box-shadow:0 20px 50px rgba(10,12,40,.12)}
.bbar{display:flex;align-items:center;gap:6px;padding:10px 14px;background:light-dark(#ECEEF4,#22264F)}
.bbar i{width:11px;height:11px;border-radius:50%;background:#C9CEDB}
.bbar span{margin-left:10px;flex:1;max-width:460px;background:var(--sf);border-radius:8px;padding:5px 12px;font-size:13px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bbody{color-scheme:light;background:#fff;color:#1F1C1A}

/* public pages */
.pub{font-size:15px}
.hero{padding:clamp(28px,5vw,56px) clamp(18px,5vw,56px);color:#fff}
.hero h2{margin:0 0 8px;font-size:clamp(28px,4vw,42px);line-height:1.05;letter-spacing:-.02em;font-weight:800;text-wrap:balance}
.hero p{margin:0;max-width:56ch;opacity:.9}
.pubw{padding:clamp(18px,4vw,40px) clamp(18px,5vw,56px);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px}
.amts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.amts button{min-height:52px;border-radius:10px;border:2px solid #E2DDD8;background:#fff;font-weight:800;font-size:17px;cursor:pointer;color:#1F1C1A}
.amts button[aria-pressed=true]{border-color:var(--pc,#B4462B);background:var(--pcl,#FBEDE8);color:var(--pc,#B4462B)}
.pbtn{min-height:52px;border:0;border-radius:12px;background:var(--pc,#B4462B);color:#fff;font-weight:800;font-size:17px;cursor:pointer;width:100%}
.menuc{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.mi{border:1px solid #E7E1DB;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:#fff}
.mi .ph2{height:76px;border-radius:9px}

/* retail */
.pos{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pbtn2{min-height:86px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:6px;font-weight:700;font-size:14px}
.pbtn2:hover{border-color:var(--ryf)}
.pbtn2 .num{color:var(--mu);font-weight:500;font-size:13px}
.kds{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tk{background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.tkh{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--nv);color:#fff;font-weight:800}
.tkh.w{background:#A86A0C}.tkh.b{background:#A3271B}
.tk ul{margin:0;padding:10px 14px 4px 30px;font-size:15px;font-weight:600;flex:1}
.tk li{padding:3px 0}.tk li small{display:block;font-weight:500;color:var(--mu)}
.floor{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tbl{border-radius:14px;border:2px solid var(--ln);background:var(--sf);min-height:92px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;text-align:left;font-size:13px}
.tbl b{font-size:16px}
.tbl.seated{background:var(--okb);border-color:var(--ryf)}
.tbl.check{background:var(--wnb);border-color:#D08A1A}
.tbl.dirty{background:var(--mub);border-style:dashed}
.tbl.sug{outline:4px solid #2F8A5B;outline-offset:2px}
.sched{display:grid;grid-template-columns:150px repeat(7,minmax(92px,1fr));min-width:860px;font-size:13px}
.sched>div{border-top:1px solid var(--ln2);padding:7px 6px;min-height:46px}
.sched .hd{font-weight:700;color:var(--mu);font-size:12px;border-top:0}
.sh{display:block;border-radius:7px;padding:4px 7px;background:var(--okb);color:var(--ok);font-weight:700;font-size:12px;margin-bottom:3px;white-space:nowrap}
.sh.w{background:var(--wnb);color:var(--wn)}.sh.g{background:var(--gnb);color:var(--gn)}.sh.b{background:var(--bdb);color:var(--bd)}
/* flow */
.flow{display:flex;flex-direction:column;align-items:center;gap:0}
.node{width:min(360px,100%);background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.node small{display:block;color:var(--mu);font-size:12px}
.node.tr{border-color:var(--ryf);background:var(--okb)}
.conn{width:2px;height:22px;background:var(--ln)}
.branch{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:640px}
.branch>div{display:flex;flex-direction:column;align-items:center}
.lbl{font-size:12px;font-weight:700;color:var(--mu);padding:3px 0}
.trace{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr) 30px minmax(0,1fr);gap:8px;align-items:center}
.arrow{color:var(--mu);text-align:center;font-size:22px}
.doc{border:1px solid var(--ln);border-radius:12px;background:#fff;color:#1F1C1A;color-scheme:light;padding:24px;font-size:14px;display:flex;flex-direction:column;gap:12px}
.sw{width:38px;height:38px;border-radius:9px;border:1px solid var(--ln)}
.ph2{display:block}

@media(max-width:900px){

 .side{position:fixed;left:0;top:0;bottom:0;width:270px;transform:translateX(-100%);transition:transform .2s;box-shadow:12px 0 40px rgba(0,0,0,.3)}

 .scrim{position:fixed;inset:0;background:rgba(8,10,35,.45);z-index:24}
 .menu{display:grid}

 .content{padding:18px 14px 150px}
 .g2,.g11,.g12,.g3,.pos{grid-template-columns:minmax(0,1fr)}

 .stack thead{display:none}.stack tr{display:grid;padding:8px 0;border-top:1px solid var(--ln2)}

 .stack td::before{content:attr(data-l);color:var(--mu);font-size:12px;font-weight:700;text-align:left}

 .stack tfoot tr{border-top:2px solid var(--ln)}

 .wel{grid-template-columns:minmax(0,1fr)}

 .hbr{grid-template-columns:minmax(80px,110px) minmax(0,1fr) auto}
 .askb span{display:none}
}

const suggest = () => {

  cat: c => { S.rt.cat = c; R(); },
  add: n => { const p = Object.values(PROD).flat().find(x => x[0] === n), c = S.rt.cart.find(x => x.n === n); if (c) c.q++; else S.rt.cart.push({ n, p: p[1], q: 1 }); R(); },
  dec: i => { const c = S.rt.cart[i]; if (--c.q <= 0) S.rt.cart.splice(i, 1); R(); },
  clear: () => { S.rt.cart = []; S.rt.guest = false; R(); },
  guest: () => { S.rt.guest = true; R(); },
  charge: () => { const sub = sum(S.rt.cart, c => c.p * c.q); S.rt.payAmt = sub + Math.round(sub * TAX * 100) / 100; S.rt.pay = 'wait'; modal('charge'); },
  tap: () => { const r = S.rt, k = r.cart.filter(c => KITCHEN.has(c.n)); r.lastKitchen = k.length > 0; if (k.length) r.tickets.push({ no: r.next, ch: 'Counter', min: 0, items: k.map(c => [(c.q > 1 ? c.q + ' × ' : '') + c.n, '']) }); r.next++; r.cart = []; r.guest = false; r.pay = 'ok'; R(); },
  bump: i => { const t = S.rt.tickets.splice(i, 1)[0]; S.rt.bumped.push(t); R(); toast(`#${t.no} ready · guest notified`); },
  recallTk: () => { S.rt.tickets.unshift(S.rt.bumped.pop()); R(); },
  onAdd: s => { const [n, p] = s.split('|'), c = S.rt.online.cart.find(x => x.n === n); if (c) c.q++; else S.rt.online.cart.push({ n, p: +p, q: 1 }); R(); },
  onTime: v => { S.rt.online.time = v; },
  onPlace: () => { const r = S.rt, o = r.online; if (!o.cart.length) return; r.tickets.push({ no: r.next, ch: 'Online · ' + (o.time.startsWith('ASAP') ? 'ASAP' : 'pickup ' + o.time), min: 0, items: o.cart.map(c => [(c.q > 1 ? c.q + ' × ' : '') + c.n, '']) }); o.done = r.next++; o.cart = []; R(); },
  onAgain: () => { S.rt.online.done = null; R(); },
  sug: () => { S.rt.sug = suggest(); R(); if (!S.rt.sug) toast('No open table fits yet; quote a longer wait'); },
  seat: () => { const r = S.rt, w = r.wait.shift(), t = r.tables.find(x => x.id === r.sug.id); t.st = 'seated'; t.party = w.p; r.sug = null; R(); toast(`${w.n} party seated at ${t.id} with ${t.sv}`); },
  tblc: id => { const t = S.rt.tables.find(x => x.id === id), nx = { open: 'seated', seated: 'check', check: 'dirty', dirty: 'open' }[t.st]; t.st = nx; t.party = nx === 'seated' ? Math.min(t.seats, 2) : nx === 'check' ? t.party : 0; S.rt.sug = null; R(); },
  addParty: () => { const names = ['Nguyen', 'Brooks', 'Olsen', 'Garcia']; S.rt.wait.push({ n: names[S.rt.wait.length % 4], p: [2, 4, 3, 5][S.rt.wait.length % 4], q: 15, w: 0 }); R(); },
  ptSplit: s => { S.rt.pt.split = s; R(); },
  ptTip: t => { S.rt.pt.tip = +t; R(); },
  ptPay: () => { S.rt.pt.paid = true; R(); },
  ptReset: () => { S.rt.pt = { split: 'Full check', tip: 20, paid: false }; R(); },
  mcat: c => { S.rt.mcat = c; R(); },
  off: n => { S.rt.off[n] = !S.rt.off[n]; R(); toast(S.rt.off[n] ? `${n} hidden on the register, online and at tables` : `${n} is back on the menu`); },
  winback: () => { S.rt.sent = true; R(); toast('Win-back offer texted to 214 guests'); },
  sheets: () => { S.rt.sheetsOk = true; R(); toast('6 timesheets approved'); },
  sync: () => { S.rt.synced = true; R(); toast('Hours sent to Gusto'); },
  // construction
  estQ: (v, el) => { S.cn.est[el.dataset.arg].q = parseFloat(v) || 0; R(); },
  estR: (v, el) => { S.cn.est[el.dataset.arg].r = parseFloat(v) || 0; R(); },
  estOh: v => { S.cn.oh = parseFloat(v) || 0; R(); },
  estPr: v => { S.cn.pr = parseFloat(v) || 0; R(); },
  estAdd: () => { S.cn.est.push({ d: 'Curing compound', u: 'sf', q: 18400, r: 0.08 }); R(); },
  estSend: () => { S.cn.estSent = true; R(); toast('Proposal sent to Prairie Point Contractors with your terms and exclusions'); },
  payCur: (v, el) => { const l = S.cn.pay[el.dataset.arg]; l.cur = Math.max(0, Math.min(100 - l.prev, parseFloat(v) || 0)); R(); },
  paySend: () => { S.cn.paySent = true; R(); toast('Pay app #6 submitted to Hawthorne Builders with lien waiver and photos'); },
  coSel: i => { S.cn.coSel = +i; R(); },
  coSend: () => { S.cn.cos[S.cn.coSel].st = 'Pending GC'; R(); toast('Sent to the GC for e-signature'); },
  coOk: () => { const c = S.cn.cos[S.cn.coSel]; c.st = 'Approved'; R(); toast(`${c.no} approved · contract and schedule of values updated by ${money(c.amt)}`); },
  comp: i => { const c = S.cn.comp[i]; c.need = false; c.st = c.k === 'Certified payroll' ? 'Submitted' : 'Requested'; R(); toast(c.k === 'Certified payroll' ? 'WH-347 generated from field hours and submitted' : 'Request sent'); },
  compAll: () => { S.cn.comp.forEach(c => { if (c.need) { c.need = false; c.st = c.k === 'Certified payroll' ? 'Submitted' : 'Requested'; } }); R(); toast('All reminders sent'); },
  move: () => { S.cn.moved = true; R(); toast('Pour moved to Thursday · supplier, pump and crew notified'); },
  hr: s => { const [i, d] = s.split(':'); const c = S.cn.field.crew[i]; c[2] = Math.max(0, c[2] + parseFloat(d)); R(); },
  fcy: v => { S.cn.field.cy = parseFloat(v) || 0; },
  photo: () => { S.cn.field.photos++; R(); },
  safety: () => { S.cn.field.safety = !S.cn.field.safety; R(); },
  fieldDone: () => { S.cn.field.done = true; R(); },
  fieldReset: () => { S.cn.field.done = false; R(); },
  // accountant
  openClient: i => { S.ac.client = CLIENTS[i][0]; go('ac-close'); },
  client: v => { S.ac.client = v; R(); },
  closeT: i => { const L = closeOf(S.ac.client); L[i].done = !L[i].done; R(); },
  revOk: i => { const r = S.ac.review.splice(i, 1)[0]; R(); toast(`Approved: ${r.desc} → ${r.sug}`); },
  revAsk: i => { const r = S.ac.review.splice(i, 1)[0]; S.ac.reqs.unshift({ c: r.c === 'Copper Kettle' ? 'Copper Kettle Café & Market' : 'Prairie Meals Alliance', t: `What was ${r.desc} for (${m2(r.a)}, ${r.d})?`, sent: 'Nov 16', st: 'Waiting on client' }); R(); toast('Question sent to the client’s AUCTIX inbox'); },
  revAll: () => { const n = S.ac.review.filter(r => r.conf >= 85).length; S.ac.review = S.ac.review.filter(r => r.conf < 85); R(); toast(`${n} transactions approved`); },
  rec: i => { S.ac.recon[i].on = !S.ac.recon[i].on; R(); },
  reconDone: () => { S.ac.reconDone = true; const L = closeOf('Copper Kettle Café & Market'); L[0].done = true; R(); toast('Reconciled · report saved and close checklist updated'); },
  jeA: (v, el) => { S.ac.je[el.dataset.arg].acct = v; },
  jeD: (v, el) => { S.ac.je[el.dataset.arg].dr = v; R(); },
  jeC: (v, el) => { S.ac.je[el.dataset.arg].cr = v; R(); },
  jeAdd: () => { S.ac.je.push({ acct: ACCTS[0], dr: '', cr: '' }); R(); },
  jePost: () => { const a = S.ac, amt = sum(a.je, l => +l.dr || 0); a.jes.push({ no: 'AJE-' + (a.jes.length + 1), d: 'Oct 31', memo: a.je.map(l => l.acct.replace(/^\d+ /, '')).join(' / '), amt, st: 'Posted' }); a.je = [{ acct: ACCTS[8], dr: '', cr: '' }, { acct: ACCTS[2], dr: '', cr: '' }]; R(); toast('Adjusting entry posted to October'); },
  lockAsk: () => modal('lock'),
  lock: () => { S.ac.locked = true; S.modal = null; const L = closeOf('Copper Kettle Café & Market'); L[L.length - 1].done = true; R(); toast('October locked for Copper Kettle'); },
  acReqModal: () => modal('acReq'),
  saveAcReq: () => { S.ac.reqs.unshift({ c: val('aqc'), t: val('aqt'), sent: 'Nov 16', st: 'Waiting on client' }); S.modal = null; R(); toast('Request sent to the client’s inbox'); },
  taxc: v => { S.ac.taxc = v; R(); },
  taxMap: (v, el) => { const k = TAXC[S.ac.taxc], i = +el.dataset.arg; S.ac.maps[k][i][2] = TAXL[k].indexOf(v); R(); }
};

/* ---------- shell ---------- */
const SITE = /(^|\.)auctixtech\.com$/.test(location.hostname) || location.hostname === 'localhost' ? '' : 'https://auctixtech.com';
const LOGO = (c = '#191B53', s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3L3.5 20h4.2l1.6-3.4h5.4l1.6 3.4h4.2L12 3zm-1.2 10.4L12 10.6l1.2 2.8z" fill="${c}"/></svg>`;
const view = () => {
  const sc = SC[S.cur], ed = ED[sc.ed], t = ed.tour;
  const nav = ed.nav.map(n => n[0] === 'h' ? `<h3>${n[1]}</h3>` : `<a href="#${n[0]}" data-go="${n[0]}"${n[0] === S.cur || (n[0] === 'np-crm' && S.cur === 'np-person') ? ' aria-current="page"' : ''}>${ico(n[2])}<span>${n[1]}</span>${SOON[n[0]] ? `<span class="soon">${SOON[n[0]]}</span>` : n[3] && n[3]() ? `<span class="cnt">${n[3]()}</span>` : ''}</a>`).join('');
  const tourStep = t[S.tour.i];
  const tourHtml = !S.tour.on ? `<button class="tpill" data-act="tourOpen">Take the tour</button>` : S.tour.min ? `<button class="tpill" data-act="tourOpen">Tour · step ${S.tour.i + 1} of ${t.length}</button>` :
    `<aside class="tour" aria-label="Guided tour"><div class="tm"><span>Step ${S.tour.i + 1} of ${t.length}</span><div class="tdots">${t.map((_, i) => `<i class="${i === S.tour.i ? 'on' : ''}"></i>`).join('')}</div><button data-act="tourMin" aria-label="Hide tour">Hide</button></div><h4>${tourStep[1]}</h4><p>${tourStep[2]}</p>${S.cur !== tourStep[0] ? `<p style="color:#F3C27A">You’ve wandered off. Next takes you back on the tour.</p>` : ''}<div class="row">${S.tour.i ? '<button data-act="tourBack">Back</button>' : ''}<button class="nx" data-act="tourNext">${S.tour.i === t.length - 1 ? 'Finish' : 'Next'}</button></div></aside>`;
  const modalHtml = S.modal ? `<div class="ov" role="dialog" aria-modal="true"><div class="bdp" data-act="close"></div><div class="mdl ${S.modal.k === 'welcome' ? 'wide' : ''}">${S.modal.k !== 'welcome' && S.modal.k !== 'charge' ? `<button class="ib" data-act="close" aria-label="Close" style="position:absolute;right:14px;top:14px;width:36px;height:36px">${ico('x', 16)}</button>` : ''}${M[S.modal.k](S.modal.arg)}</div></div>` : '';
  const askHtml = S.ask ? `<div class="scrim" style="position:fixed;inset:0;background:rgba(8,10,35,.35);z-index:54" data-act="ask"></div><aside class="drawer" aria-label="Ask AUCTIX"><div class="dh"><span class="ai">${ico('spark', 18)}</span><b>Ask AUCTIX</b><span class="pill wn">Coming soon</span><button class="ib" data-act="ask" aria-label="Close" style="margin-left:auto;width:36px;height:36px">${ico('x', 16)}</button></div><div class="db"><p class="sub" style="margin:0">Ask about your own numbers in plain English. It reads your books, CRM and schedules, and it can draft, but you approve anything it sends. Sample answers below.</p>${S.chat.map(c => `<div class="bub me">${c[0]}</div><div class="bub">${c[1]}</div>`).join('')}${ed.ask.map((q, i) => `<button class="qbtn" data-act="askQ" data-arg="${i}">${q[0]}</button>`).join('')}</div></aside>` : '';
  return `<div class="demo"><a class="brand" href="${SITE}/" aria-label="AUCTIX home"><span class="mark">${LOGO()}</span>AUCTIX <small>Interactive demo · sample data</small></a><div class="eds" role="group" aria-label="Business type">${Object.entries(ED).map(([k, e]) => `<button type="button" aria-pressed="${k === sc.ed}" data-act="edTab" data-arg="${k}">${e.name}</button>`).join('')}</div><div class="dright"><button class="dbtn so" data-act="welcome">Start over</button><button class="dbtn" data-act="reset">Reset</button><a class="dbtn p" href="${SITE}/get-started">Get started</a></div></div>
  <div class="shell ${S.nav ? 'open' : ''}">${S.nav ? '<div class="scrim" data-act="nav"></div>' : ''}<nav class="side" aria-label="Main"><button type="button" class="org" data-act="welcome" aria-label="Switch sample business"><span class="badge" style="background:${ed.color}">${ed.badge}</span><span style="flex:1"><b>${ed.org}</b><span>${ed.place}</span></span><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="color:#A9B4D6"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg></button><div class="nav">${nav}</div><div class="me"><span class="av">${ed.user[0]}</span><span style="flex:1"><b>${ed.user[1]}</b><span>${ed.user[2]}</span></span></div></nav>
  <main class="main"><header class="top"><button class="ib menu" data-act="nav" aria-label="Open menu">${ico('bars')}</button><label class="srch"><span style="position:absolute;left:-9999px">Search</span>${ico('search', 16)}<input type="search" id="gsearch" placeholder="Search ${sc.ed === 'np' ? 'donors, gifts, transactions' : sc.ed === 'rt' ? 'items, guests, orders' : sc.ed === 'cn' ? 'jobs, change orders, invoices' : 'clients, transactions, requests'}…"></label><span class="chip">Sample data · ${ed.launch}</span><button class="askb" data-act="ask">${ico('spark', 16)}<span>Ask AUCTIX</span></button><button class="ib" aria-label="Notifications" data-act="toastMsg" data-arg="3 new: gift received, request viewed, task due">${ico('bell')}</button></header>
  <div class="content">${SOON[S.cur] ? `<div class="note" style="border-style:solid;background:var(--wnb);color:var(--wn);border-color:transparent"><b>Coming later:</b> restaurant tools (kitchen display, host station and pay at table) follow the spring 2027 retail launch.</div>` : ''}${sc.r()}</div></main></div>${tourHtml}${modalHtml}${askHtml}`;
};

const R = () => {
  const a = document.activeElement, fid = a && a.id, ss = a && a.selectionStart, se = a && a.selectionEnd;
  app.innerHTML = view();
  if (fid) { const n = document.getElementById(fid); if (n && n !== document.body) { n.focus({ preventScroll: true }); try { if (ss != null && n.setSelectionRange) n.setSelectionRange(ss, se); } catch (_) { } } }
};
const go = (id, fromTour) => {
  if (!SC[id]) id = 'np-overview';
  S.cur = id; S.nav = false; S.modal = S.modal && S.modal.k === 'welcome' ? null : null; S.ask = false;
  if (SC[id].ed !== S.ed) { S.ed = SC[id].ed; S.tour.i = 0; S.chat = []; }
  if (!fromTour && S.tour.on) { const j = ED[S.ed].tour.findIndex(x => x[0] === id); if (j >= 0) S.tour.i = j; }
  try { if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id); } catch (_) { }
  R(); window.scrollTo(0, 0);
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-act]'); if (!el || el.disabled) return;
  if (el.tagName === 'A' || el.dataset.go) e.preventDefault();
  if (el.dataset.go) go(el.dataset.go);
  else { const f = A[el.dataset.act]; if (f) f(el.dataset.arg, el, e); }
});
document.addEventListener('change', e => { const el = e.target.closest('[data-ch]'); if (el && A[el.dataset.ch]) A[el.dataset.ch](el.value, el); });
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && A[el.dataset.in]) A[el.dataset.in](el.value, el); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (S.modal) A.close(); else if (S.ask) A.ask(); else if (S.nav) A.nav(); } });
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (SC[id] && id !== S.cur) go(id); });

const start = location.hash.slice(1);
if (SC[start]) { S.cur = start; S.ed = SC[start].ed; const j = ED[S.ed].tour.findIndex(x => x[0] === start); if (j >= 0) S.tour.i = j; R(); }
else { S.cur = 'np-overview'; S.modal = { k: 'welcome' }; R(); }
}
</script>
</body>
</html>
